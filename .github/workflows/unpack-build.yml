name: Unpack build archive
on:
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the build archive
        run: |
          unzip -o github-pages-polish2-upload.zip
          rm -rf assets/photos
          cp -a github-pages/. .
          rm -rf github-pages github-pages-polish2-upload.zip .github
          ls -l index.html
          ls assets/photos | wc -l
      - name: Commit extracted build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publish Google TV simulator Build 2026.11.05-polish2"
          git push
